[project]
name = "mimiqcircuits"
# A release bumps this, `version` in Cargo.toml, and both lock files.
version = "0.30.1"
description = "User API for MIMIQ by QPerfect. Build quantum circuits, schedule remote simulations, and explore simulation results."
authors = [{ name = "Guido Masella", email = "guido.masella@qperfect.io" }]
readme = "README.md"
requires-python = ">=3.10,<4"
dependencies = [
    "numpy (>=1.26,<3.0)",
    "mimiqlink (>=0.9,<0.10)",
    "bitarray (>=3.10,<4)",
    "symengine (>=0.14.1,<0.15)",
    "sympy (>=1.12,<2)",
    "protobuf (>=6.33,<7)",
    "scipy (>1.13,<2)",
    "tqdm (>=4.66,<5)",
]
license = "Apache-2.0"

[project.urls]
Documentation = "https://docs.qperfect.io"
Repository = "https://github.com/qperfect-io/mimiqcircuits-python"

[project.optional-dependencies]
visualization = ["matplotlib (>=3.8,<4)"]
graph = ["networkx (>=3,<4)"]

[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[tool.maturin]
# A mixed project: the Python package is src/mimiqcircuits, and the Rust crate
# described by Cargo.toml (sources in rust/) is compiled into it as
# `mimiqcircuits._core`. The wheel is abi3 (CPython 3.10+) except when built
# by a free-threaded interpreter, which gets a wheel for that version only.
python-source = "src"
module-name = "mimiqcircuits._core"
# Deprecated in pyo3 0.29 in favour of an environment variable that only
# recent maturin releases set; kept so every maturin the bound admits builds
# an extension that does not link libpython.
features = ["pyo3/extension-module"]
# Repository tooling that building or testing the package does not need.
exclude = [
    { path = ".github/**/*", format = "sdist" },
    { path = ".gitlab-ci.yml", format = "sdist" },
    { path = "scripts/**/*", format = "sdist" },
    { path = "logo.svg", format = "sdist" },
]

[dependency-groups]
dev = [
    "pytest>=8.2,<9",
    "pytest-xdist>=3,<4",
    "pytest-accept>=0.1,<0.2",
    "pytest-doctest-import>=0.1,<0.2",
    "pytest-benchmark>=4.0,<5",
    "mpmath>=1.3,<2",
]
docs = [
    "sphinx>=7.3,<8",
    "jupyter-sphinx>=0.5,<0.6",
    "sphinx-copybutton>=0.5,<0.6",
    "sphinx-inline-tabs>=2023.4",
    "myst-parser>=4.0,<5",
    "myst-nb>=1.1,<2",
    "linkify-it-py>=2.0,<3",
    "sphinx-design>=0.6,<0.7",
    "furo>=2025.12.19",
    "matplotlib>3,<4"
]

[tool.uv]
# Rebuild the extension on `uv sync` / `uv run` when the Rust sources change.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "Cargo.lock" },
    { file = "rust/**/*.rs" },
]
