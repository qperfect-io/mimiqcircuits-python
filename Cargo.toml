# The native extension `mimiqcircuits._core`, built by maturin (see
# [tool.maturin] in pyproject.toml). The Rust sources live under rust/ because
# src/ is the Python package.
[package]
name = "mimiqcircuits"
# Must equal `version` in pyproject.toml: a release bumps both, and Cargo.lock.
version = "0.30.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
authors = ["Guido Masella <guido.masella@qperfect.io>"]
repository = "https://github.com/qperfect-io/mimiqcircuits-python"
publish = false

[lib]
name = "_core"
path = "rust/src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
# Bounds close at the next version allowed to break (the minor for 0.y).
# `abi3-py310` makes one wheel serve every CPython from 3.10. On a
# free-threaded interpreter pyo3 ignores it (there is no stable ABI there) and
# builds a version-specific extension instead.
pyo3 = { version = ">=0.29.2, <0.30", features = ["abi3-py310"] }
num-bigint = ">=0.4.6, <0.5"
num-complex = ">=0.4.6, <0.5"
num-integer = ">=0.1.46, <0.2"
num-traits = ">=0.2.19, <0.3"

[profile.release]
lto = true
codegen-units = 1
